<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - AcherLab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Change Password</h1>
        <p>Default password must be changed</p>
      </div>
      <form id="pwForm" class="login-form">
        <div class="form-group">
          <label for="old">Current Password</label>
          <input type="password" id="old" required>
        </div>
        <div class="form-group">
          <label for="new">New Password (min 4 chars)</label>
          <input type="password" id="new" minlength="4" required>
        </div>
        <button type="submit" class="btn btn-primary" id="pwBtn">Change Password</button>
        <div class="login-error" id="pwError"></div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('pwForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('pwBtn');
      const err = document.getElementById('pwError');
      btn.disabled = true; btn.textContent = 'Changing...';
      try {
        const r = await fetch('/api/change-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({old_password: document.getElementById('old').value, new_password: document.getElementById('new').value})
        });
        const d = await r.json();
        if (r.ok) window.location.href = '/';
        else { err.textContent = d.error || 'Error'; err.style.display = 'block'; }
      } catch(e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
      btn.disabled = false; btn.textContent = 'Change Password';
    });
  </script>
</body>
</html>
