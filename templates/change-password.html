<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - AcherLab Stress Tool</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      position: relative;
      z-index: 1;
    }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo h1 { font-size: 20px; font-weight: 700; color: var(--text-primary); }
    .auth-logo p { font-size: 13px; color: var(--accent-yellow); margin-top: 8px; }
    .auth-form .form-group { margin-bottom: 18px; }
    .auth-form label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
    .auth-form input { width: 100%; padding: 12px 14px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit; }
    .auth-form input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(25,215,255,0.1); }
    .auth-form .btn { width: 100%; justify-content: center; padding: 12px; font-size: 15px; margin-top: 8px; }
    .auth-error { color: var(--accent-red); font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    .auth-success { color: var(--accent-green); font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    .info-box {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.2);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--accent-yellow);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Change Password</h1>
      <p>⚠️ You must change the default password to continue</p>
    </div>
    <div class="info-box">
      For security reasons, please set a new password for your account.
    </div>
    <form class="auth-form" id="changeForm">
      <div class="form-group">
        <label for="old_password">Current Password</label>
        <input type="password" id="old_password" placeholder="Enter current password" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" placeholder="Enter new password (min 4 chars)" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" placeholder="Confirm new password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Change Password</button>
      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess">Password changed! Redirecting...</div>
    </form>
  </div>
  <script>
    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('.btn');
      btn.disabled = true; btn.textContent = 'Changing...';
      const err = document.getElementById('authError');
      const suc = document.getElementById('authSuccess');
      err.style.display = 'none'; suc.style.display = 'none';
      const old = document.getElementById('old_password').value;
      const np = document.getElementById('new_password').value;
      const cf = document.getElementById('confirm_password').value;
      if (np !== cf) { err.textContent = 'Passwords do not match'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Change Password'; return; }
      if (np.length < 4) { err.textContent = 'Password must be at least 4 characters'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Change Password'; return; }
      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_password: old, new_password: np })
        });
        const data = await res.json();
        if (res.ok) {
          suc.textContent = 'Password changed! Redirecting...';
          suc.style.display = 'block';
          setTimeout(() => window.location.href = '/', 1000);
        } else {
          err.textContent = data.error || 'Failed';
          err.style.display = 'block';
        }
      } catch(e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
      btn.disabled = false; btn.textContent = 'Change Password';
    });
  </script>
</body>
</html>
