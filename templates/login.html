<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcherLab - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <svg class="logo-icon" viewBox="0 0 40 40" width="48" height="48">
          <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#19D7FF"/><stop offset="100%" style="stop-color:#7B2FF7"/></linearGradient></defs>
          <rect x="4" y="4" width="32" height="32" rx="8" fill="url(#lg)" opacity="0.15"/>
          <path d="M20 8L32 16V28L20 36L8 28V16L20 8Z" fill="none" stroke="url(#lg)" stroke-width="2"/>
          <circle cx="20" cy="22" r="4" fill="url(#lg)" opacity="0.6"/>
        </svg>
        <h1>AcherLab</h1>
        <p>Stress Tool Controller</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" value="admin" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: document.getElementById('username').value, password: document.getElementById('password').value})
        });
        const d = await r.json();
        if (r.ok) window.location.href = d.pw_changed ? '/' : '/change-password';
        else { err.textContent = d.error || 'Invalid credentials'; err.style.display = 'block'; }
      } catch(e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
      btn.disabled = false; btn.textContent = 'Sign In';
    });
  </script>
</body>
</html>
