<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AcherLab Stress Tool</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      position: relative;
      z-index: 1;
    }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo svg { margin-bottom: 12px; }
    .auth-logo h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .auth-logo p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .auth-form .form-group { margin-bottom: 20px; }
    .auth-form label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
    .auth-form input { width: 100%; padding: 12px 14px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit; }
    .auth-form input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(25,215,255,0.1); }
    .auth-form .btn { width: 100%; justify-content: center; padding: 12px; font-size: 15px; margin-top: 8px; }
    .auth-error { color: var(--accent-red); font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 40 40" width="48" height="48">
        <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#19D7FF"/><stop offset="100%" style="stop-color:#7B2FF7"/></linearGradient></defs>
        <rect x="4" y="4" width="32" height="32" rx="8" fill="url(#lg)" opacity="0.15"/>
        <path d="M20 8L32 16V28L20 36L8 28V16L20 8Z" fill="none" stroke="url(#lg)" stroke-width="2"/>
        <circle cx="20" cy="22" r="4" fill="url(#lg)" opacity="0.6"/>
      </svg>
      <h1>AcherLab Stress Tool</h1>
      <p>Enter your credentials to continue</p>
    </div>
    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="admin" value="admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
      <div class="auth-error" id="authError">Invalid credentials</div>
    </form>
    <div class="auth-footer">Default: admin / admin123 · Change password on first login</div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('.btn');
      btn.disabled = true; btn.textContent = 'Signing in...';
      const err = document.getElementById('authError');
      err.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = data.pw_changed ? '/' : '/change-password';
        } else {
          err.textContent = data.error || 'Invalid credentials';
          err.style.display = 'block';
        }
      } catch(e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
      btn.disabled = false; btn.textContent = 'Sign In';
    });
  </script>
</body>
</html>
