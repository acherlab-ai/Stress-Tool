<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcherLab - Multi Worker Control</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-grid"></div>

  <header class="header">
    <div class="header-content">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 40 40" width="36" height="36">
          <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient></defs>
          <rect x="4" y="4" width="32" height="32" rx="8" fill="url(#lg)" opacity="0.15"/>
          <path d="M20 8L32 16V28L20 36L8 28V16L20 8Z" fill="none" stroke="url(#lg)" stroke-width="2"/>
          <circle cx="20" cy="22" r="4" fill="url(#lg)" opacity="0.6"/>
        </svg>
        <div>
          <h1>AcherLab Controller</h1>
          <span class="subtitle">Multi-Worker · Task Queue</span>
        </div>
      </div>
      <div class="header-status">
        <span id="workerCount" class="worker-count">0 workers</span>
        <button class="btn-icon" id="logoutBtn" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="layout">
      <aside class="sidebar">
        <section class="card">
          <div class="card-header"><h2>Workers</h2></div>
          <div id="workerList" class="worker-list"></div>
        </section>
      </aside>

      <div class="content">
        <section class="card">
          <div class="card-header"><h2>New Attack</h2></div>
          <form id="configForm" class="config-form">
            <div class="form-row">
              <div class="form-group">
                <label for="method">Method</label>
                <select id="method">
                  <optgroup label="Layer7">
                    <option value="GET">GET</option><option value="POST">POST</option><option value="CFB">CFB</option>
                    <option value="BYPASS">BYPASS</option><option value="CFBUAM">CFBUAM</option><option value="OVH">OVH</option>
                    <option value="DGB">DGB</option><option value="AVB">AVB</option><option value="GSB">GSB</option>
                    <option value="DYN">DYN</option><option value="STRESS">STRESS</option><option value="SLOW">SLOW</option>
                    <option value="HEAD">HEAD</option><option value="COOKIE">COOKIE</option><option value="XMLRPC">XMLRPC</option>
                    <option value="APACHE">APACHE</option><option value="NULL">NULL</option><option value="RHEX">RHEX</option>
                    <option value="BOT">BOT</option><option value="KILLER">KILLER</option><option value="PPS">PPS</option>
                    <option value="EVEN">EVEN</option><option value="DOWNLOADER">DOWNLOADER</option><option value="TOR">TOR</option>
                    <option value="STOMP">STOMP</option><option value="BOMB">BOMB</option>
                  </optgroup>
                  <optgroup label="Layer4">
                    <option value="TCP">TCP</option><option value="UDP">UDP</option><option value="SYN">SYN</option>
                    <option value="CPS">CPS</option><option value="CONNECTION">CONNECTION</option><option value="VSE">VSE</option>
                    <option value="TS3">TS3</option><option value="FIVEM">FIVEM</option><option value="MINECRAFT">MINECRAFT</option>
                    <option value="MCBOT">MCBOT</option><option value="MEM">MEM</option><option value="NTP">NTP</option><option value="DNS">DNS</option>
                  </optgroup>
                </select>
              </div>
              <div class="form-group" style="flex:2">
                <label for="url">Target</label>
                <input type="text" id="url" placeholder="https://example.com or ip:port" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label for="threads">Threads</label><input type="number" id="threads" value="100" min="1"></div>
              <div class="form-group"><label for="duration">Duration (s)</label><input type="number" id="duration" value="60" min="1" max="86400"></div>
              <div class="form-group"><label for="rpc">RPC</label><input type="number" id="rpc" value="10" min="1"></div>
              <div class="form-group"><label for="proxyType">Proxy</label><select id="proxyType"><option value="0">All</option><option value="1">HTTP</option><option value="4">SOCKS4</option><option value="5">SOCKS5</option><option value="6">Random</option></select></div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="assignTo">Assign to</label>
                <select id="assignTo"><option value="">Any available worker</option></select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" id="startBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Send Task
            </button>
          </form>
        </section>

        <section class="card">
          <div class="card-header"><h2>Task History</h2><span class="task-count" id="taskCount">0</span></div>
          <div class="task-list" id="taskList"><div class="task-empty">No tasks</div></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="footer">&copy; 2026 AcherLab</footer>
  <div class="toast" id="toast"></div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
